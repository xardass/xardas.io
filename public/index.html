<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#191715">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <title>Xardas</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #191715; }
    body { overflow: hidden; }

    .page {
      position: relative;
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
      background: #191715;
      isolation: isolate;
    }
    .page::before {
      content: '';
      position: absolute;
      z-index: 0;
      inset: -18%;
      pointer-events: none;
      background: radial-gradient(ellipse at 25% 28%, rgba(154,146,133,.09) 0%, rgba(112,105,94,.045) 20%, transparent 48%);
      filter: blur(32px);
    }
    .page::after {
      content: '';
      position: absolute;
      z-index: 3;
      inset: 0;
      pointer-events: none;
      opacity: .025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
    }
    .tower-glimpse {
      position: absolute;
      top: 0;
      left: 0;
      width: min(82vw, 72rem, 117vh);
      aspect-ratio: 3 / 2;
      z-index: 1;
      pointer-events: none;
      opacity: .28;
      background: url('./xardas-tower.png') center / 100% 100% no-repeat;
      filter: saturate(.58) sepia(.10) brightness(.72) contrast(1.04);
      -webkit-mask-image: radial-gradient(ellipse 28% 38% at 30% 38%, #000 0%, rgba(0,0,0,.96) 30%, rgba(0,0,0,.72) 54%, rgba(0,0,0,.34) 74%, rgba(0,0,0,.10) 89%, transparent 100%);
      mask-image: radial-gradient(ellipse 28% 38% at 30% 38%, #000 0%, rgba(0,0,0,.96) 30%, rgba(0,0,0,.72) 54%, rgba(0,0,0,.34) 74%, rgba(0,0,0,.10) 89%, transparent 100%);
    }
    .wordmark {
      position: absolute;
      top: clamp(1.2rem, 2.5vw, 2.2rem);
      right: clamp(1.15rem, 2.5vw, 2.2rem);
      z-index: 2;
      margin: 0;
      color: rgba(231,225,209,.32);
      font: 500 clamp(.58rem, .7vw, .68rem)/1 Georgia, serif;
      letter-spacing: .48em;
      text-transform: uppercase;
      user-select: none;
    }


    @media (max-width: 720px) {
      .tower-glimpse {
        width: 100vw;
        opacity: .24;
      }

    }
  </style>
</head>
<body>
  <main class="page" aria-label="Xardas landing page">
    <div class="tower-glimpse" aria-hidden="true"></div>
    <p class="wordmark">Xardas</p>
  </main>
</body>
</html>
