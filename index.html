<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#191715">
  <title>Xardas</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #191715; }
    body { overflow-x: hidden; }

    .scroll-space { height: 205vh; background: #191715; }
    .scene {
      position: sticky;
      top: 0;
      height: 100vh;
      height: 100svh;
      padding: clamp(18px, 3.2vw, 54px);
      background: #191715;
      overflow: hidden;
    }
    .frame {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      isolation: isolate;
      background: #171714;
      box-shadow: inset 0 0 0 1px rgba(229,221,199,.055);
    }
    .landscape, .tone, .cover-mist, .grain, .vignette {
      position: absolute;
      pointer-events: none;
    }
    .landscape {
      inset: -7%;
      background: url('./xardas-tower.png') 38% 48% / cover no-repeat;
      filter: saturate(.72) sepia(.08) hue-rotate(350deg) brightness(.95) contrast(.98);
      transform: scale(1.07);
      will-change: transform, filter;
      z-index: 0;
    }
    .tone {
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(90deg, rgba(13,16,12,.17), transparent 42%, rgba(34,28,20,.04)),
        linear-gradient(180deg, rgba(183,190,178,.025), transparent 54%, rgba(8,10,7,.22));
      mix-blend-mode: multiply;
    }
    .cover-mist {
      left: -16%;
      right: -16%;
      bottom: -12vh;
      height: 94vh;
      z-index: 4;
      opacity: 0;
      filter: blur(26px);
      transform: translate3d(0,34vh,0) scale(1.08);
      will-change: transform, opacity;
      overflow: visible;
    }
    .cover-mist .mist-drift {
      position: absolute;
      inset: 0 auto 0 -18%;
      width: 136%;
      height: 100%;
      will-change: transform;
      background:
        radial-gradient(ellipse at 12% 52%, rgba(220,224,214,.68), transparent 35%),
        radial-gradient(ellipse at 43% 62%, rgba(198,205,192,.58), transparent 42%),
        radial-gradient(ellipse at 73% 48%, rgba(218,222,212,.62), transparent 36%),
        radial-gradient(ellipse at 96% 67%, rgba(202,210,198,.52), transparent 32%),
        linear-gradient(180deg, transparent 4%, rgba(198,205,192,.20) 40%, rgba(188,195,182,.68) 100%);
      animation: coverMistDrift 14s linear infinite alternate;
    }
    @keyframes coverMistDrift {
      from { transform: translate3d(-8%, 3%, 0) scale(1.02); }
      to   { transform: translate3d(8%, -5%, 0) scale(1.06); }
    }

    .bottom-mist {
      position: absolute;
      left: -12%;
      right: -12%;
      bottom: -3vh;
      height: 32vh;
      z-index: 3;
      overflow: hidden;
      pointer-events: none;
    }
    .mist-band {
      position: absolute;
      left: -18%;
      width: 136%;
      will-change: transform;
    }
    .mist-band--thin {
      bottom: 46%;
      height: 22%;
      opacity: .36;
      filter: blur(10px);
      background:
        radial-gradient(ellipse at 12% 55%, rgba(220,225,215,.62), transparent 48%),
        radial-gradient(ellipse at 50% 48%, rgba(203,211,199,.52), transparent 52%),
        radial-gradient(ellipse at 86% 58%, rgba(218,223,213,.58), transparent 46%);
      animation: thinMistBand 9s linear infinite alternate;
    }
    .mist-band--thick {
      bottom: -18%;
      height: 62%;
      opacity: .52;
      filter: blur(18px);
      background:
        radial-gradient(ellipse at 8% 66%, rgba(220,224,214,.74), transparent 48%),
        radial-gradient(ellipse at 38% 58%, rgba(203,210,198,.68), transparent 54%),
        radial-gradient(ellipse at 72% 67%, rgba(215,220,210,.72), transparent 49%),
        radial-gradient(ellipse at 98% 54%, rgba(198,207,194,.60), transparent 45%),
        linear-gradient(180deg, transparent 10%, rgba(190,198,185,.48) 100%);
      animation: thickMistBand 7s linear infinite alternate;
    }
    @keyframes thinMistBand {
      from { transform: translate3d(-10%, 20%, 0); }
      to   { transform: translate3d(12%, -25%, 0); }
    }
    @keyframes thickMistBand {
      from { transform: translate3d(11%, 12%, 0) scale(1.03); }
      to   { transform: translate3d(-11%, -16%, 0) scale(1.08); }
    }
    .grain {
      inset: 0; z-index: 5; opacity: .08;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.88' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
    }
    .vignette {
      inset: 0; z-index: 6;
      background:
        radial-gradient(ellipse at center, transparent 42%, rgba(7,8,6,.24) 100%),
        linear-gradient(180deg, rgba(15,16,13,.03), transparent 62%, rgba(14,15,12,.30));
    }
    .contact-sigil {
      position: absolute;
      left: clamp(1.15rem, 2.4vw, 2.2rem);
      bottom: clamp(1.1rem, 2.4vw, 2rem);
      z-index: 8;
      width: clamp(13rem, 22vw, 19rem);
      height: clamp(2.6rem, 4.8vw, 3.5rem);
      opacity: .78;
      cursor: pointer;
      border: 0;
      padding: 0;
      background: transparent;
      will-change: transform, opacity;
    }
    .contact-sigil canvas { display: block; width: 100%; height: 100%; }
    .contact-sigil:focus-visible { outline: 1px solid rgba(232,225,207,.55); outline-offset: 6px; }

    @media (max-width: 720px) {
      .scroll-space { height: 180vh; }
      .scene { padding: 14px; padding-bottom: max(14px, env(safe-area-inset-bottom)); }
      .landscape { inset: -14%; background-position: 31% 49%; background-size: auto 116%; }
      .contact-sigil {
        left: 1rem;
        bottom: max(1rem, env(safe-area-inset-bottom));
        width: min(72vw, 16rem);
        height: 3rem;
      }
      .cover-mist { filter: blur(24px); }
    }
    @media (max-width: 420px) {
      .scroll-space { height: 165vh; }
      .landscape { inset: -17%; background-position: 29% 50%; background-size: auto 114%; }
    }
    @media (prefers-reduced-motion: reduce) {
      .scroll-space { height: 125vh; }
      .mist-drift, .mist-band { animation: none; }
    }
  </style>
</head>
<body>
  <main class="scroll-space" aria-label="Xardas atmospheric landing page">
    <section class="scene">
      <div class="frame" aria-label="A distant gothic tower above a misty valley">
        <div class="landscape"></div>
        <div class="tone"></div>
        <div class="bottom-mist" aria-hidden="true">
          <div class="mist-band mist-band--thin"></div>
          <div class="mist-band mist-band--thick"></div>
        </div>
        <div class="cover-mist" aria-hidden="true"><div class="mist-drift"></div></div>
        <div class="grain"></div>
        <div class="vignette"></div>
        <button class="contact-sigil" type="button" aria-label="Email Xavier">
          <canvas></canvas>
        </button>
      </div>
    </section>
  </main>

  <script>
    const landscape = document.querySelector('.landscape');
    const coverMist = document.querySelector('.cover-mist');
    const contact = document.querySelector('.contact-sigil');
    const canvas = contact.querySelector('canvas');
    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const emailCodes = [120,97,118,105,101,114,64,120,97,114,100,97,115,46,105,111];
    const email = () => String.fromCharCode(...emailCodes);

    function drawContact() {
      const rect = contact.getBoundingClientRect();
      const dpr = Math.min(2, devicePixelRatio || 1);
      canvas.width = Math.max(1, Math.round(rect.width * dpr));
      canvas.height = Math.max(1, Math.round(rect.height * dpr));
      const ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);
      ctx.clearRect(0, 0, rect.width, rect.height);
      const y = rect.height * .53;

      ctx.strokeStyle = 'rgba(226,219,199,.28)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, y + 11);
      ctx.lineTo(Math.min(26, rect.width * .12), y + 11);
      ctx.stroke();

      ctx.fillStyle = 'rgba(237,231,214,.90)';
      ctx.font = `${Math.max(15, Math.min(21, rect.height * .43))}px Georgia, serif`;
      ctx.textBaseline = 'middle';
      ctx.fillText(email(), Math.min(34, rect.width * .15), y);
    }

    function render() {
      const max = Math.max(1, document.documentElement.scrollHeight - innerHeight);
      const p = Math.min(1, Math.max(0, scrollY / max));
      const eased = 1 - Math.pow(1 - p, 2.1);
      const mistProgress = Math.min(1, Math.max(0, (p - .08) / .92));
      const mistEased = 1 - Math.pow(1 - mistProgress, 1.7);

      coverMist.style.transform = `translate3d(${-mistEased}%, ${34 - mistEased * 41}vh, 0) scale(${1.08 + mistEased * .06})`;
      coverMist.style.opacity = String(mistEased * .62);
      contact.style.opacity = String(.78 - eased * .10);
      contact.style.transform = `translateY(${-eased * 3}px)`;

      if (!reduced) {
        landscape.style.transform = `scale(${1.07 + eased * .025}) translate3d(0, ${-eased * .7}%, 0)`;
        landscape.style.filter = `saturate(${.72 - eased * .05}) sepia(.08) hue-rotate(350deg) brightness(${.95 + eased * .025}) contrast(.98)`;
      }
    }

    contact.addEventListener('click', () => { location.href = 'mai' + 'lto:' + email(); });
    addEventListener('scroll', render, { passive: true });
    addEventListener('resize', () => { render(); drawContact(); });
    drawContact();
    render();
  </script>
</body>
</html>
