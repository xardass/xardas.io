<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#191715">
  <title>Xardas</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #191715; }
    body { overflow: hidden; }

    .page {
      position: relative;
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
      background: #191715;
      isolation: isolate;
    }
    .tower-glimpse {
      position: absolute;
      top: 0;
      left: 0;
      width: min(82vw, 72rem);
      height: min(78vh, 50rem);
      pointer-events: none;
      opacity: .28;
      background: url('./xardas-tower.png') left top / contain no-repeat;
      filter: saturate(.58) sepia(.10) brightness(.72) contrast(1.04);
      -webkit-mask-image: radial-gradient(ellipse at top left, #000 0%, rgba(0,0,0,.92) 34%, transparent 76%);
      mask-image: radial-gradient(ellipse at top left, #000 0%, rgba(0,0,0,.92) 34%, transparent 76%);
    }
    .contact-sigil {
      position: absolute;
      left: clamp(1.15rem, 2.4vw, 2.2rem);
      bottom: clamp(1.1rem, 2.4vw, 2rem);
      z-index: 1;
      width: clamp(13rem, 22vw, 19rem);
      height: clamp(2.6rem, 4.8vw, 3.5rem);
      opacity: .78;
      cursor: pointer;
      border: 0;
      padding: 0;
      background: transparent;
    }
    .contact-sigil canvas { display: block; width: 100%; height: 100%; }
    .contact-sigil:focus-visible { outline: 1px solid rgba(232,225,207,.55); outline-offset: 6px; }

    @media (max-width: 720px) {
      .tower-glimpse {
        width: 100vw;
        height: 62vh;
        opacity: .24;
      }
      .contact-sigil {
        left: 1rem;
        bottom: max(1rem, env(safe-area-inset-bottom));
        width: min(72vw, 16rem);
        height: 3rem;
      }
    }
  </style>
</head>
<body>
  <main class="page" aria-label="Xardas landing page">
    <div class="tower-glimpse" aria-hidden="true"></div>
    <button class="contact-sigil" type="button" aria-label="Email Xavier">
      <canvas></canvas>
    </button>
  </main>

  <script>
    const contact = document.querySelector('.contact-sigil');
    const canvas = contact.querySelector('canvas');
    const emailCodes = [120,97,118,105,101,114,64,120,97,114,100,97,115,46,105,111];
    const email = () => String.fromCharCode(...emailCodes);

    function drawContact() {
      const rect = contact.getBoundingClientRect();
      const dpr = Math.min(2, devicePixelRatio || 1);
      canvas.width = Math.max(1, Math.round(rect.width * dpr));
      canvas.height = Math.max(1, Math.round(rect.height * dpr));
      const ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);
      ctx.clearRect(0, 0, rect.width, rect.height);
      const y = rect.height * .53;

      ctx.strokeStyle = 'rgba(226,219,199,.28)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, y + 11);
      ctx.lineTo(Math.min(26, rect.width * .12), y + 11);
      ctx.stroke();

      ctx.fillStyle = 'rgba(237,231,214,.90)';
      ctx.font = `${Math.max(15, Math.min(21, rect.height * .43))}px Georgia, serif`;
      ctx.textBaseline = 'middle';
      ctx.fillText(email(), Math.min(34, rect.width * .15), y);
    }

    contact.addEventListener('click', () => { location.href = 'mai' + 'lto:' + email(); });
    addEventListener('resize', drawContact);
    drawContact();
  </script>
</body>
</html>
